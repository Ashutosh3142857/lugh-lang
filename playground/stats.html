<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lugh usage</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1c1c1a;--muted:#6b6a64;--line:#e3e1da;--accent:#2f5d50;--accent2:#c08a2a;--grid:#eeece6}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--panel:#1b1b19;--ink:#ecebe6;--muted:#9a9993;--line:#2c2c29;--accent:#7fb8a6;--accent2:#e2b45c;--grid:#252522}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0}header a{color:var(--muted)}
#updated{color:var(--muted);font-size:13px;margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .v{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{color:var(--muted);font-size:13px;margin-top:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:16px}
@media (max-width:560px){.charts{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:14px;margin:0 0 2px}.card p{margin:0 0 8px;color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg{width:100%;height:auto;display:block}
svg text{font:11px system-ui,sans-serif;fill:var(--muted)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:5px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.links{margin-top:24px;color:var(--muted);font-size:13px}.links a{color:inherit}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:5px;opacity:0;transition:opacity .1s}
</style></head><body>
<header><h1>Lugh usage</h1><a href="./">← Playground</a><a href="https://github.com/Ashutosh3142857/lugh-lang">GitHub</a><span id="updated">Loading…</span></header>
<main>
  <div class="tiles" id="tiles"></div>
  <div class="charts" id="charts"></div>
  <div class="links">Also listed on <a href="https://glama.ai/mcp/servers/Ashutosh3142857/lugh-lang">Glama</a> and <a href="https://mcprush.com/ashutosh3142857/lugh-mcp">mcprush</a>, which keep their own analytics. Numbers are recorded once a day by a GitHub Action; downloads include registry mirrors and automated installs.</div>
</main>
<div id="tip"></div>
<script>
const DATA = "https://raw.githubusercontent.com/Ashutosh3142857/lugh-lang/main/stats/data.json";
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = n => n >= 10000 ? (n/1000).toFixed(1).replace(/\.0$/,"") + "k" : n.toLocaleString("en");
const tip = document.getElementById("tip");

function days(series){ return Object.keys(series||{}).sort(); }
function sum(series, key){ return Object.values(series||{}).reduce((a,v)=>a+(key? v[key] : v),0); }
function lastN(series, n){ const ks=days(series).slice(-n); return Object.fromEntries(ks.map(k=>[k,series[k]])); }

function tile(v,l){ return `<div class="tile"><div class="v">${fmt(v)}</div><div class="l">${l}</div></div>`; }

// Bar chart for one or two daily series. Missing days show as zero.
function chart(title, note, series){
  const all = [...new Set(series.flatMap(s=>days(s.data)))].sort();
  if(!all.length) return `<div class="card"><h2>${title}</h2><p>${note}</p><div class="empty">No data yet</div></div>`;
  const start = new Date(all[0]), end = new Date(all[all.length-1]);
  const dates = []; for(let d=new Date(start); d<=end; d.setUTCDate(d.getUTCDate()+1)) dates.push(d.toISOString().slice(0,10));
  const W=520,H=190,L=34,B=22,T=8, iw=W-L-8, ih=H-B-T;
  const raw = Math.max(1, ...series.flatMap(s=>dates.map(d=>s.data[d]??0)));
  const tick = Math.max(1, Math.ceil(raw/3/Math.pow(10,Math.floor(Math.log10(raw/3||1))))*Math.pow(10,Math.floor(Math.log10(raw/3||1))));
  const max = tick*3;
  const step = iw/dates.length, bw = Math.max(1, Math.min(18, step*0.8/series.length));
  let g = "";
  for(let i=0;i<=3;i++){ const y=T+ih-ih*i/3, v=tick*i;
    g += `<line x1="${L}" x2="${W-8}" y1="${y}" y2="${y}" stroke="${css('--grid')}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`; }
  const every = Math.ceil(dates.length/6);
  dates.forEach((d,i)=>{ if(i%every===0||i===dates.length-1) g+=`<text x="${L+step*i+step/2}" y="${H-6}" text-anchor="middle">${d.slice(5)}</text>`; });
  series.forEach((s,si)=>{
    dates.forEach((d,i)=>{ const v=s.data[d]??0; if(!v) return;
      const h=ih*v/max, x=L+step*i+(step-bw*series.length)/2+si*bw;
      g+=`<rect x="${x}" y="${T+ih-h}" width="${bw}" height="${h}" rx="1.5" fill="${s.color}" data-tip="${d} · ${s.name}: ${v.toLocaleString('en')}"/>`; });
  });
  const legend = series.length>1 ? `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>` : "";
  return `<div class="card"><h2>${title}</h2><p>${note}</p>${legend}<svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}

function pick(series, key){ return Object.fromEntries(Object.entries(series||{}).map(([d,v])=>[d,v[key]])); }

fetch(DATA, {cache:"no-cache"}).then(r=>r.json()).then(d=>{
  document.getElementById("updated").textContent = "Updated " + d.updated;
  const gh = d.github||{}, lastGh = gh[days(gh).at(-1)] || {};
  document.getElementById("tiles").innerHTML =
    tile(sum(d.npm), "npm downloads, all time") +
    tile(sum(lastN(d.npm,7)), "npm downloads, last 7 days") +
    tile(sum(d.crates), "crates.io downloads") +
    tile((d.traffic_14d&&d.traffic_14d.views)?d.traffic_14d.views.uniques:0, "GitHub unique visitors, 14 days") +
    tile(sum(d.views,"count"), "GitHub page views, recorded") +
    tile(lastGh.stars??0, "GitHub stars");
  const a = css("--accent"), b = css("--accent2");
  document.getElementById("charts").innerHTML =
    chart("npm downloads", "lugh-lang per day: CLI and MCP server", [{name:"downloads",color:a,data:d.npm||{}}]) +
    chart("GitHub page views", "Repository traffic per day", [{name:"views",color:a,data:pick(d.views,"count")},{name:"unique visitors",color:b,data:pick(d.views,"uniques")}]) +
    chart("GitHub clones", "Includes CI runs and directory crawlers", [{name:"clones",color:a,data:pick(d.clones,"count")},{name:"unique cloners",color:b,data:pick(d.clones,"uniques")}]) +
    chart("crates.io downloads", "Lugh Core (Rust) per day", [{name:"downloads",color:a,data:d.crates||{}}]) +
    chart("GitHub stars", "Recorded daily", [{name:"stars",color:b,data:pick(d.github,"stars")}]) +
    (d.referrers && d.referrers.items.length ? `<div class="card"><h2>Where visitors come from</h2><p>GitHub referrers, last 14 days (as of ${d.referrers.as_of})</p><table>${d.referrers.items.map(r=>`<tr><td>${r.referrer}</td><td>${r.count} views · ${r.uniques} unique</td></tr>`).join("")}</table></div>` : "");
}).catch(e=>{ document.getElementById("updated").textContent = "Could not load stats: " + e.message; });

document.addEventListener("mousemove", e=>{
  const t = e.target.getAttribute && e.target.getAttribute("data-tip");
  if(t){ tip.textContent=t; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY-28)+"px"; tip.style.opacity=1; }
  else tip.style.opacity=0;
});
</script>
</body></html>
