name: Release

# Push a tag like v0.7.0, or run this workflow by hand, after setting the same version in
# core/Cargo.toml, npm/package.json and npm/server.json. It publishes Lugh Core to crates.io, lugh-lang to npm, and the MCP server to the
# official MCP Registry. Needs repository secrets CARGO_REGISTRY_TOKEN and NPM_TOKEN;
# the MCP Registry uses GitHub OIDC and needs no secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # npm provenance and MCP Registry login
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Versions agree with the tag
        run: |
          node npm/test/versions.test.mjs
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "v$(node -p "require('./npm/package.json').version")" = "${GITHUB_REF_NAME}"
          fi

      - name: Build lugh.wasm
        working-directory: core
        run: cargo rustc --release --lib --no-default-features --target wasm32-unknown-unknown --crate-type cdylib
      - name: Test the npm package against it
        run: |
          cp core/target/wasm32-unknown-unknown/release/lugh_core.wasm npm/lugh.wasm
          node npm/test/mcp.test.mjs

      # Each step skips a version that is already published, so a failed
      # release can simply be re-run.
      - name: Publish lugh-lang to npm
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: npm
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "lugh-lang@$V" version >/dev/null 2>&1; then echo "lugh-lang $V is already on npm"; exit 0; fi
          npm publish --provenance --access public

      - name: Publish to the MCP Registry
        # The registry checks that the npm package exists, so this follows npm.
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: npm
        run: |
          NAME=$(node -p "require('./server.json').name"); V=$(node -p "require('./server.json').version")
          if curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=$NAME" | grep -q "\"version\":\"$V\""; then
            echo "$NAME $V is already in the MCP Registry"; exit 0
          fi
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Publish Lugh Core to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        working-directory: core
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if curl -fsS -A "lugh-release (github.com/Ashutosh3142857/lugh-lang)" "https://crates.io/api/v1/crates/lugh/$V" >/dev/null 2>&1; then echo "lugh $V is already on crates.io"; exit 0; fi
          cargo publish

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./npm/package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          gh release create "$TAG" npm/lugh.wasm --target "$GITHUB_SHA" --title "Lugh $TAG" --generate-notes
