[package]
name = "lugh"
version = "0.7.2"
edition = "2021"
description = "Lugh Core: runtime and CLI for Lugh, a programming language for AI agents with policy, budgets and human approval in the syntax"
license = "MIT"
authors = ["Ashutosh Pandey"]
repository = "https://github.com/Ashutosh3142857/lugh-lang"
homepage = "https://ashutosh3142857.github.io/lugh-lang/"
documentation = "https://github.com/Ashutosh3142857/lugh-lang/blob/main/docs/SPEC.md"
readme = "README.md"
keywords = ["ai-agents", "mcp", "language", "guardrails", "llm"]
categories = ["command-line-utilities", "compilers", "development-tools"]
exclude = ["target/", "tests/"]

[lib]
name = "lugh_core"
path = "src/lib.rs"

[[bin]]
name = "lugh"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
# Everything that needs the operating system or network. Build without it
# (--no-default-features) for the browser.
native = ["dep:ureq", "dep:rusqlite", "dep:getrandom", "dep:libz-sys", "flate2/zlib"]

[dependencies]
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libz-sys = { version = "1", features = ["static"], optional = true }
ureq = { version = "2", features = ["json", "native-certs"], optional = true }
regex = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = { version = "0.2", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
