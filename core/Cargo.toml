[package]
name = "lugh"
version = "0.6.0"
edition = "2021"
description = "Native runtime for the Lugh agent programming language"
license = "MIT"
authors = ["Ashutosh Pandey"]
repository = "https://github.com/Ashutosh3142857/lugh-lang"

[[bin]]
name = "lugh"
path = "src/main.rs"

[dependencies]
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libz-sys = { version = "1", features = ["static"] }
ureq = { version = "2", features = ["json", "native-certs"] }
regex = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
